# Firmware CI: compile the Arduino Uno sketch on every change so a broken build
# is caught before it reaches a board.
#
# Arduino requires the sketch folder to be named after the .ino file
# (ELEGOO-Smart-Robot-Car-Kit-V4.0-New), but the GitHub repo is named
# elegoo-smart-car-v4. The checkout step therefore clones into an explicitly
# named path, and the base-commit build for size deltas uses a git worktree
# created under the same folder name.

name: Firmware CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SKETCH_DIR: ELEGOO-Smart-Robot-Car-Kit-V4.0-New
  FQBN: arduino:avr:uno
  ARDUINO_CLI_VERSION: 1.5.1
  AVR_CORE_VERSION: 1.8.8
  # Versions the firmware was last verified against. FastLED must stay on 3.9.x:
  # 3.10+ defines the Timer1 ISR unconditionally and collides with Servo.
  LIBS_PINNED: FastLED@3.9.20 IRremote@4.7.1 Servo@1.3.0 MPU6050@1.4.5
  LIBS_LATEST: FastLED IRremote Servo MPU6050
  # Uno: 32256 B usable flash, 2048 B SRAM. Leave headroom for the stack and
  # for String/JSON heap use at runtime.
  MAX_FLASH_PCT: "95"
  MAX_RAM_PCT: "80"

jobs:
  compile:
    name: Compile (${{ matrix.deps }} dependencies)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        deps: [pinned, latest]
    # The "latest" leg is an early warning that an upstream library or core
    # update will break the build. It never fails the workflow.
    continue-on-error: ${{ matrix.deps == 'latest' }}
    steps:
      - name: Checkout into a folder named after the sketch
        uses: actions/checkout@v7
        with:
          path: ${{ env.SKETCH_DIR }}
          # Full history so the base commit is available for the size delta.
          fetch-depth: 0

      - name: Set up arduino-cli
        uses: arduino/setup-arduino-cli@v2
        with:
          version: ${{ env.ARDUINO_CLI_VERSION }}

      - name: Cache Arduino core and libraries
        if: matrix.deps == 'pinned'
        uses: actions/cache@v6
        with:
          path: |
            ~/.arduino15
            ~/Arduino/libraries
          key: arduino-${{ runner.os }}-cli${{ env.ARDUINO_CLI_VERSION }}-avr${{ env.AVR_CORE_VERSION }}-${{ hashFiles(format('{0}/.github/workflows/firmware-ci.yml', env.SKETCH_DIR)) }}

      - name: Install core and libraries
        shell: bash
        run: |
          set -euo pipefail
          arduino-cli core update-index
          arduino-cli lib update-index
          if [ "${{ matrix.deps }}" = "pinned" ]; then
            arduino-cli core install "arduino:avr@${AVR_CORE_VERSION}"
            # shellcheck disable=SC2086
            arduino-cli lib install ${LIBS_PINNED}
          else
            arduino-cli core install arduino:avr
            # shellcheck disable=SC2086
            arduino-cli lib install ${LIBS_LATEST}
          fi
          echo "::group::Installed versions"
          arduino-cli core list
          arduino-cli lib list
          echo "::endgroup::"

      - name: Compile firmware (this commit)
        id: head
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/out"
          # --format json puts compiler output in the JSON and exits non-zero on
          # failure. The default shell runs with -e, so capture the exit code
          # with || instead of letting the step abort; the report step then
          # fails the job with the compiler error in the job summary.
          rc=0
          arduino-cli compile --fqbn "$FQBN" --warnings default \
            --output-dir "$RUNNER_TEMP/out" --format json "$SKETCH_DIR" \
            > "$RUNNER_TEMP/head.json" || rc=$?
          echo "exit=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" -ne 0 ]; then
            echo "::warning::arduino-cli compile exited with $rc; see the report step and job summary"
          fi

      - name: Compile firmware (base commit, for size deltas)
        if: matrix.deps == 'pinned' && steps.head.outputs.exit == '0'
        shell: bash
        run: |
          set -uo pipefail
          case "${{ github.event_name }}" in
            pull_request) base="${{ github.event.pull_request.base.sha }}" ;;
            push)         base="${{ github.event.before }}" ;;
            *)            base="" ;;
          esac
          # New branch (all-zero SHA), force-push to an unknown commit, or no
          # event SHA: fall back to the parent of HEAD if there is one.
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
             || ! git -C "$SKETCH_DIR" cat-file -e "$base^{commit}" 2>/dev/null; then
            base="$(git -C "$SKETCH_DIR" rev-parse --verify -q HEAD^ || true)"
          fi
          if [ -z "$base" ]; then
            echo "No base commit available; skipping delta build."
            exit 0
          fi
          echo "Base commit: $base"
          git -C "$SKETCH_DIR" worktree add --detach "$RUNNER_TEMP/base/$SKETCH_DIR" "$base"
          # A base that fails to compile is not an error for this run; the
          # report just omits the deltas.
          arduino-cli compile --fqbn "$FQBN" --warnings none --format json \
            "$RUNNER_TEMP/base/$SKETCH_DIR" > "$RUNNER_TEMP/base.json" || true

      - name: Report sizes, warnings and enforce limits
        shell: bash
        run: |
          args=(--head "$RUNNER_TEMP/head.json" --label "${{ matrix.deps }}" \
                --sketch-dir "$SKETCH_DIR" \
                --max-flash-pct "$MAX_FLASH_PCT" --max-ram-pct "$MAX_RAM_PCT")
          [ -f "$RUNNER_TEMP/base.json" ] && args+=(--base "$RUNNER_TEMP/base.json")
          # Only the pinned leg enforces headroom; latest just reports.
          [ "${{ matrix.deps }}" = "pinned" ] && args+=(--enforce)
          python3 "$SKETCH_DIR/.github/scripts/firmware_report.py" "${args[@]}"

      - name: Upload firmware binaries
        if: matrix.deps == 'pinned' && steps.head.outputs.exit == '0'
        uses: actions/upload-artifact@v7
        with:
          name: firmware-uno-${{ github.sha }}
          path: ${{ runner.temp }}/out/*.hex
          if-no-files-found: error
          retention-days: 30
